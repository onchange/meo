<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MEOポテンシャル診断 | 株式会社山西屋</title>
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>
<body>
  <header class="header">
    <h1 class="header__title">MEOポテンシャル診断</h1>
    <p class="header__subtitle">Powered by 政府統計オープンデータ</p>
  </header>

  <div id="loading" class="loading">
    <span class="loading-spinner"></span>データを読み込み中...
  </div>

  <section id="form-section" class="form-section" hidden>
    <div class="form-row">
      <label class="form-label">
        都道府県
        <select id="prefecture" class="form-select">
          <option value="">選択してください</option>
        </select>
      </label>
      <label class="form-label">
        市区町村
        <select id="municipality" class="form-select" disabled>
          <option value="">先に都道府県を選択</option>
        </select>
      </label>
      <label class="form-label">
        業種
        <select id="industry" class="form-select">
          <option value="">選択してください</option>
        </select>
      </label>
    </div>
    <button id="diagnose-btn" class="btn-diagnose" disabled>診断する</button>
  </section>

  <section id="report" class="report" hidden>
    <div class="report__grid">

      <div class="card card--score">
        <h2 class="card__title">MEOポテンシャルスコア</h2>
        <div class="score-gauge">
          <svg id="gauge-svg" viewBox="0 0 200 120" class="gauge-svg"></svg>
        </div>
        <p class="score-number"><span id="score-value">--</span><span class="score-unit"> / 100点</span></p>
        <p class="score-label" id="score-label"></p>
        <p class="score-comment" id="score-comment"></p>
      </div>

      <div class="card card--density">
        <h2 class="card__title">エリア競合密度</h2>
        <p class="card__headline" id="density-headline"></p>
        <div class="chart-container">
          <canvas id="density-chart"></canvas>
        </div>
      </div>

      <div class="card card--per-capita">
        <h2 class="card__title">人口あたり店舗密度</h2>
        <p class="stat-big" id="per-capita-value"></p>
        <p class="stat-sub" id="per-capita-avg"></p>
        <p class="stat-note">密度が高い = 競合が激しい → MEOで差別化が必要</p>
      </div>

      <div class="card card--population">
        <h2 class="card__title">エリア人口プロフィール</h2>
        <div class="pop-stats">
          <div class="pop-stat">
            <span class="pop-stat__label">総人口</span>
            <span class="pop-stat__value" id="pop-total"></span>
          </div>
          <div class="pop-stat">
            <span class="pop-stat__label">昼夜間人口比</span>
            <span class="pop-stat__value" id="pop-daytime"></span>
          </div>
        </div>
        <div class="chart-container chart-container--small">
          <canvas id="age-chart"></canvas>
        </div>
      </div>

    </div>

    <div class="card card--map">
      <h2 class="card__title">エリアマップ</h2>
      <p class="map-summary" id="map-summary"></p>
      <div id="area-map" class="map-container"></div>
    </div>

    <div class="card card--talk">
      <h2 class="card__title">営業トーク</h2>
      <div class="talk-box">
        <p class="talk-text" id="talk-text"></p>
        <button class="btn-copy" id="copy-btn">コピー</button>
      </div>
    </div>

    <footer class="report__footer">
      <p>出典: 総務省「令和3年経済センサス-活動調査」／総務省「令和2年国勢調査」</p>
    </footer>
  </section>

  <script src="score.js"></script>
  <script src="chart.js"></script>
  <script src="map.js"></script>
  <script src="app.js"></script>
</body>
</html>
